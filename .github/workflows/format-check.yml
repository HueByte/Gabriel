# 1b. Format Check — `dotnet format --verify-no-changes`, reading
# .editorconfig as its style source. What the editor writes, git stores, and
# this gate enforces are the same bytes; EF migrations are skipped via
# generated_code=true in .editorconfig.
#
# Trigger surface (budget-aware): PRs to main + manual dispatch, and only when
# C# / build files could have changed.
#
# Catches: formatting drift in hand-written C#.
# Does NOT catch: webapp formatting (no formatter gate there yet), semantics.
name: 1b. Format Check

on:
  pull_request:
    branches: [main]
    paths:
      - "src/api/**"
      - ".editorconfig"
      - ".github/workflows/format-check.yml"
  workflow_dispatch:

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet format (verify only)
        run: dotnet format src/api/Gabriel.slnx --verify-no-changes
